---
# cPanel deployment tasks, run on "Deploy HEAD Commit" (Git Version Control).
#
# The clone installs, builds, migrates the database and restarts the pm2 processes itself. See the
# script for the steps and DEPLOY.md for the one-time setup it expects.
#
# The steps live in a script rather than here so they can be read and run as one unit, over SSH
# too. It is invoked through bash rather than directly so the executable bit, which is easy to lose
# when committing from Windows, does not matter. Tasks run from the repository root.
#
# cPanel runs this under WHM > Tweak Settings > "Max cPanel process memory"; the build needs that
# limit high enough (see DEPLOY.md, "Things to know").
deployment:
  tasks:
    - /bin/bash deployment-tools/deploy.sh
